<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚠️ SANDBOX — Team Pelagio</title>
<!-- PWA install support — only takes effect over HTTPS (GitHub Pages), not file://.
     Manifest gives Android its "Install app" prompt; the apple-touch-icon + meta tags
     below cover iOS, which ignores manifest.json for home-screen icon/fullscreen mode. -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pelagio SANDBOX">
<meta name="theme-color" content="#1e1414">
<style>
  /* ============================================================
     Nocturne / HUD reskin (2026-08-30) — see
     design_handoff_fiskeraknare_ui_v1/README.md for the full spec
     this implements (Riktning 2, the preferred/iterated direction).
     Existing --token NAMES kept identical to their pre-redesign
     values on purpose: dozens of inline style="color:var(--muted)"
     etc. calls are scattered through the JS below (settings, stats,
     forms) — reusing the names means every one of those
     automatically picks up the new palette with zero JS changes,
     instead of a huge, error-prone find/replace across template
     strings. Only actual layout/component classes (rows, chips,
     buttons, sheet) were rewritten as new structure.
     ============================================================ */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  :root{
    --bg:#1e1414;
    --panel:#2e1c1c;      /* surface */
    --panel2:#362020;     /* raised-on-surface (chips, inputs) */
    --text:#e9e9ed;
    --muted:#9397ab;      /* neutral-500 */
    --muted2:#75798c;     /* neutral-600, fainter labels */
    --faint:#595d6c;      /* neutral-700, mono captions */
    --accent:#9184d9;
    --accent-300:#d2cefd;
    --accent-400:#b5abfc; /* glow source */
    --accent-700:#5d5294;
    --good:#3fb27f;
    --bad:#d9534f;
    --border:#33364a;
    --border-accent:rgba(145,132,217,.24);
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* Tells the browser to render native form-control chrome (select's own
     open dropdown list, scrollbars, etc.) using dark-appropriate colors
     regardless of OS/browser default — without this, a native <select>'s
     OPTION LIST specifically ignores most CSS and falls back to a
     bright default in some browsers/preview environments even though the
     closed control itself looks fine. */
  html{color-scheme:dark;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:var(--sans);
    -webkit-user-select:none; user-select:none;}
  #app{max-width:520px;margin:0 auto;padding-bottom:110px;position:relative;}
  /* Ambience — subtle scanline + radial ground, HUD signature. Decorative
     only: pointer-events:none so it never intercepts a tap. */
  #app::before{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(233,233,237,.028) 0 1px, transparent 1px 4px);
    mix-blend-mode:screen;
  }
  #app::after{
    content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:radial-gradient(120% 60% at 50% -10%, var(--panel) 0%, var(--bg) 55%, var(--bg) 100%);
  }

  header{
    position:sticky; top:0; z-index:10;
    background:rgba(22,24,38,.94); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border-accent);
    padding:9px 14px 10px;
  }
  .brand{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .brand-left{display:flex; align-items:center; gap:10px;}
  .brand-logo{height:38px; width:auto; flex:none; display:block;}
  .status-chip{
    display:inline-flex; align-items:center; gap:6px; flex:none;
    padding:4px 9px; border:1px solid rgba(145,132,217,.35); border-radius:4px;
    font:500 10px/1 var(--mono); letter-spacing:.18em; color:var(--accent-300);
    white-space:nowrap; text-transform:uppercase;
  }
  .status-dot{
    width:6px; height:6px; border-radius:50%; background:var(--accent-400); flex:none;
    box-shadow:0 0 8px var(--accent);
    animation:statusPulse 2.4s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){ .status-dot{ animation:none; } }
  @keyframes statusPulse{ 0%,100%{opacity:.25;} 50%{opacity:1;} }

  /* Right-side header cluster (2026-08-31): sync status + weather status
     + (once identity is locked) the avatar/name badge that used to live
     as a chip in the session bar. Wraps to a second line, right-aligned,
     rather than overflowing/clipping if it doesn't fit next to the logo
     on one line at narrow widths. */
  .header-right{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    justify-content:flex-end; flex:1; min-width:0;
  }
  .status-chip-weather{
    color:var(--muted2); border-color:rgba(233,233,237,.15);
    text-transform:none; letter-spacing:.04em;
  }
  .identity-badge{display:inline-flex; align-items:center; gap:6px; flex:none;}
  .identity-name{font:500 12px var(--mono); color:var(--accent-300); white-space:nowrap;}

  .readout-strip{
    display:flex; gap:16px; margin-top:9px; overflow-x:auto;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  .readout-strip::-webkit-scrollbar{display:none;}
  .readout-strip .ro{display:flex; flex-direction:column; gap:2px; flex:none;}
  .readout-strip .ro-label{
    font:500 8px var(--mono); letter-spacing:.2em; text-transform:uppercase; color:var(--muted2);
    white-space:nowrap;
  }
  .readout-strip .ro-value{font:500 12px var(--mono); color:var(--text); white-space:nowrap;}
  .readout-strip .ro-value.stale{color:var(--muted2);}

  .session-bar{
    display:flex; gap:7px; overflow-x:auto; padding:9px 0 0;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  .session-bar::-webkit-scrollbar{display:none;}
  .chip{
    background:linear-gradient(180deg,rgba(145,132,217,.07),rgba(145,132,217,0)), var(--panel2);
    box-shadow:inset 0 0 12px rgba(145,132,217,.06);
    border:1px solid var(--border); color:var(--text);
    border-radius:4px; padding:0 12px; height:40px; font-size:12.5px; white-space:nowrap;
    display:flex; align-items:center; gap:6px; flex:none;
  }
  .chip b{
    color:var(--muted2); font:500 8px/1 var(--mono); letter-spacing:.2em;
    text-transform:uppercase; white-space:nowrap;
  }
  .chip-select{padding:0 10px 0 12px;}
  .chip-select select{
    background:transparent; color:var(--accent-300); border:none; font:500 13px var(--mono);
    max-width:120px;
  }
  .chip-select select:focus{outline:none;}

  .chip-fiskare{
    border-color:rgba(145,132,217,.45); padding:5px 12px 5px 5px; gap:8px;
    font-family:inherit;
  }
  .chip-fiskare b{color:var(--muted2);}
  .chip-locked{opacity:.85; cursor:default;}
  .chip-fiskare > span:last-child{color:var(--accent-300); font:500 13px var(--mono);}
  .fiskare-chip-avatar{
    width:28px; height:28px; border-radius:50%; overflow:hidden; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:var(--accent-700); color:var(--accent-100,#f5f4ff); font-weight:700; font-size:12px;
    box-shadow:0 0 0 1px var(--accent), 0 0 10px rgba(145,132,217,.35);
  }
  .fiskare-chip-avatar img{width:100%; height:100%; object-fit:cover; display:block;}

  .fiskare-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  .fiskare-card{
    background:var(--panel2); border:1px solid rgba(233,233,237,.12); border-radius:6px;
    padding:16px 8px 13px; display:flex; flex-direction:column; align-items:center; gap:11px;
    font-family:inherit;
  }
  .fiskare-card.active{
    border-color:var(--accent);
    background:linear-gradient(180deg,rgba(145,132,217,.14),rgba(145,132,217,.02));
  }
  .fiskare-card-photo{
    width:88px; height:88px; border-radius:50%; overflow:hidden;
    background:var(--accent-700); color:var(--accent-300); font-weight:700; font-size:32px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 1px rgba(233,233,237,.12);
  }
  .fiskare-card.active .fiskare-card-photo{
    box-shadow:0 0 0 1px var(--accent), 0 0 22px rgba(145,132,217,.35);
  }
  .fiskare-card-photo img{width:100%; height:100%; object-fit:cover; display:block;}
  .fiskare-card-name{font:500 11px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--text);}
  .fiskare-card.active .fiskare-card-name{color:var(--accent-300);}

  .grid{padding:9px 14px 4px; display:flex; flex-direction:column; gap:0; position:relative; z-index:1;}
  .species-header{
    display:flex; align-items:baseline; gap:10px; margin:14px 0 6px;
  }
  .species-header:first-child{margin-top:0;}
  .species-header .name{
    font:500 10px var(--mono); letter-spacing:.2em; text-transform:uppercase; white-space:nowrap;
  }
  .species-header .rule{
    flex:1; height:1px;
    background:linear-gradient(to right, rgba(233,233,237,.14), rgba(233,233,237,0));
  }
  .species-header .total{font:400 10px var(--mono); color:var(--muted2); white-space:nowrap;}

  .row{
    display:grid; grid-template-columns:64px 1fr 64px; height:74px;
    margin-bottom:6px; border-radius:6px; position:relative; overflow:hidden;
    border:1px solid rgba(233,233,237,.07);
    background:rgba(233,233,237,.015);
  }
  .row.has-count{
    border-color:rgba(145,132,217,.24);
    background:linear-gradient(180deg,rgba(145,132,217,.06),rgba(145,132,217,.01));
  }
  .row .share-line{
    position:absolute; left:0; bottom:0; height:2px; width:0%;
  }
  .row .side{
    display:flex; align-items:center; justify-content:center;
    font-family:var(--sans); font-weight:300; background:transparent; border:0;
  }
  .row .side.minus{
    font-size:26px; color:var(--muted2); border-right:1px solid rgba(233,233,237,.07);
  }
  .row .side.minus:active{background:rgba(233,233,237,.05);}
  .row .side.plus{
    font-size:30px; color:var(--accent-300); border-left:1px solid rgba(145,132,217,.22);
    background:linear-gradient(180deg,rgba(145,132,217,.1),rgba(145,132,217,.02));
  }
  .row .side.plus:active{background:rgba(145,132,217,.32);}
  .row .mid{
    flex:1; display:flex; align-items:center; justify-content:space-between;
    padding:0 12px; min-width:0;
  }
  .row .mid-label{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .row .label{
    font:500 11px var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--text);
  }
  .row .meta{font:400 9px var(--mono); color:var(--muted2);}
  .row .weight-span{font:400 9px var(--mono); color:var(--faint);}
  .row .count{
    font:500 40px/1 var(--mono); color:var(--faint); text-align:right; flex:none;
  }
  .row.has-count .count{color:#f3f5fe; text-shadow:0 0 12px rgba(181,171,252,.28);}
  .row:active{filter:brightness(1.08);}

  footer{
    position:fixed; bottom:0; left:0; right:0;
    background:#0f1119;
    border-top:1px solid var(--border-accent);
    padding:9px 11px calc(11px + env(safe-area-inset-bottom));
    display:flex; gap:5px; align-items:center; justify-content:space-between;
    max-width:520px; margin:0 auto;
  }
  .btn{
    border:1px solid var(--border); border-radius:4px; padding:0 12px; height:44px;
    font:500 10px var(--mono); letter-spacing:.1em; text-transform:uppercase;
    display:flex; align-items:center; justify-content:center; gap:6px;
    background:transparent; color:var(--muted);
  }
  .bar-btn{flex:none; color:var(--muted);}
  /* Teaser/placeholder for a not-yet-built feature — deliberately looks
     muted/inert like a disabled control, but stays a real, clickable
     button (a genuinely disabled one wouldn't fire click at all) so
     tapping it can still show the "kanske" popup. Two-line label, so it
     overrides the single-line uppercase mono styling every other bar
     button uses — reads as a distinct, still-informal teaser rather than
     a real utilitarian action. */
  .bar-btn-teaser{
    flex-direction:column; gap:1px; color:var(--faint); opacity:.7;
    text-transform:none; letter-spacing:normal; font-family:var(--sans);
  }
  .bar-btn-teaser small{font:400 8px var(--mono); letter-spacing:.04em; color:var(--faint);}
  .btn-export{
    border-color:var(--accent); color:var(--accent-300);
    box-shadow:0 0 16px rgba(145,132,217,.24); font-size:11px;
  }
  .btn-export:disabled{
    border-color:var(--border); color:var(--faint); box-shadow:none; opacity:1;
  }
  .btn-settings{flex:none;}

  /* Modal / bottom sheet */
  .overlay{position:fixed; inset:0; background:rgba(9,10,16,.78); display:none; align-items:flex-end; z-index:50;}
  .overlay.open{display:flex;}
  .sheet{
    background:linear-gradient(180deg, var(--panel), var(--bg));
    width:100%; max-width:520px; margin:0 auto;
    border-radius:10px 10px 0 0; border-top:1px solid var(--accent-700);
    padding:18px 15px calc(22px + env(safe-area-inset-bottom));
    max-height:86vh; overflow-y:auto;
    box-shadow:0 -18px 44px rgba(0,0,0,.7);
  }
  .sheet h2{
    margin:0 0 14px; font:500 12px var(--mono); letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent-300);
  }
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:600; text-transform:uppercase; letter-spacing:.4px;}
  .field select, .field input{
    width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    padding:11px 12px; border-radius:4px; font-size:15px; font-family:var(--mono);
  }
  .field select:focus-visible, .field input:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .sheet .btn{margin-top:6px; width:100%;}
  .btn-primary{background:transparent; border-color:var(--accent); color:var(--accent-300); height:44px;}
  .btn-primary:disabled{opacity:.5;}
  .btn-secondary{background:transparent; color:var(--text); border:1px solid var(--border); height:44px;}
  .row-actions{display:flex; gap:10px;}
  .row-actions .btn{margin-top:0;}

  .option-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    width:100%; height:50px; padding:0 14px; margin-bottom:6px;
    border-radius:4px; border:1px solid var(--border); background:transparent;
    font:400 13px var(--mono); letter-spacing:.06em; color:var(--text);
  }
  .option-row.selected{
    border-color:var(--accent-700); background:rgba(145,132,217,.12); color:var(--accent-300);
  }
  .option-row .check{color:var(--accent-300); font-size:13px;}

  .catch-list{max-height:220px; overflow-y:auto; border:1px solid var(--border); border-radius:4px;}
  .catch-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 12px; border-bottom:1px solid var(--border); font-size:13.5px;
  }
  .catch-item:last-child{border-bottom:none;}
  .catch-item span.tag{color:var(--muted); font-size:11.5px;}
  .catch-item button{background:none; border:none; color:var(--bad); font-size:18px; padding:4px 8px;}

  .stats-table-wrap{
    max-height:320px; overflow:auto; border:1px solid var(--border); border-radius:4px;
  }
  .stats-table{border-collapse:collapse; width:100%; font-size:12px; white-space:nowrap; font-family:var(--mono);}
  .stats-table th, .stats-table td{padding:7px 10px; border-bottom:1px solid var(--border); text-align:left;}
  .stats-table thead th{
    position:sticky; top:0; background:var(--panel2); color:var(--muted2);
    font-size:8px; text-transform:uppercase; letter-spacing:.18em; border-bottom:1px solid var(--accent-700);
  }
  .stats-table tbody tr:last-child td{border-bottom:none;}
  .stats-summary{display:flex; gap:7px; margin-top:14px; flex-wrap:wrap;}
  .stats-chip{
    flex:1; min-width:70px; text-align:center;
    background:linear-gradient(180deg,rgba(145,132,217,.08),rgba(145,132,217,0));
    border:1px solid rgba(145,132,217,.22); border-radius:6px; padding:8px 6px;
    font-size:8px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted2);
  }
  .stats-chip b{display:block; font:500 24px var(--mono); color:var(--text); margin-bottom:2px;}
  .measure-cell{
    background:none; border:1px dashed var(--accent-700); border-radius:4px; color:var(--accent-700);
    font-size:11px; font-weight:500; padding:3px 8px; font-family:var(--mono);
  }
  .measure-cell:not(.unset){color:var(--text); border-style:solid; border-color:var(--border);}

  .cell-select{
    -webkit-appearance:none; appearance:none;
    background:var(--panel); border:1px solid rgba(233,233,237,.1); border-radius:4px;
    color:var(--text); font-size:11px; font-weight:500; font-family:var(--mono);
    padding:5px 16px 5px 6px; max-width:110px; height:29px;
  }
  .cell-select:focus{outline:none; border-color:var(--accent);}
  .del-cell{background:none; border:none; color:var(--bad); font-size:16px; padding:2px 6px;}

  .toast{
    position:fixed; left:14px; right:14px; bottom:78px; z-index:60;
    max-width:492px; margin:0 auto;
    background:rgba(43,39,65,.95); border:1px solid var(--accent-700); border-radius:4px;
    padding:10px 14px; font:500 12px var(--mono); color:var(--accent-300);
    box-shadow:0 0 24px rgba(145,132,217,.18);
    opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .toast.show{opacity:1;}

  .status{font-size:12px; text-align:center; padding:6px; color:var(--muted);}
  .status.ok{color:var(--good);}
  .status.err{color:var(--bad);}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">

// registration/approval/token-handout flow itself (see TODO.md). A device
// with no token configured simply never attempts the Postgres write at
// all — nothing to misattribute, nothing to leak.

// ---------- Live weather auto-fill (2026-08-31) ----------
// Replaces the old manual Vindriktning/Lufttryck/Lufttryckstrend dropdowns
// with an automatic read from Homelab's SMHI pipeline. Vattentemp is
// deliberately NOT part of this — that stays the angler's own sonar
// reading at the actual fishing spot, a genuinely different (and more
// trusted, per the user) measurement than an open-sea weather station's.
//
// This token is SELECT-only on one view of public, non-sensitive weather
// data (role: weather_reader) — unlike every write token in this file, a
// leak has no meaningful consequence, so unlike config.pgToken it's fine
// to hardcode here directly rather than needing a per-device Settings field.
const WEATHER_READER_TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoid2VhdGhlcl9yZWFkZXIifQ.AXmSNfJUpgq1TsN2I0nTd5VZvMzrx76AhwERLKLf-YU';
// Same server as the Postgres write path above, just a clearer name at
// the call site below since this is a GET against the weather schema,
// not a fishing/gym write.
const WEATHER_BASE_URL = PG_BASE_URL;

// Translation layer — required, not optional. The live endpoint and this
// app's own value lists (which fishing.catches' CHECK constraints mirror)
// use completely different vocabularies; sending the raw API values
// straight through would fail Postgres's CHECK constraint outright (a
// real bug Homelab caught before this was built, not just a style choice).
// Mapping into the app's EXISTING format means the Sheet and Postgres both
// keep receiving exactly the same kind of value they always have — nothing
// about either destination's structure changes, only how the value gets
// chosen (automatically instead of manually).
const WIND_DIR_MAP = {
  'N': 'Nord', 'NO': 'Nordost', 'Ö': 'Öst', 'SO': 'Sydost',
  'S': 'Syd', 'SV': 'Sydvästlig', 'V': 'Väst', 'NV': 'Nordväst'
};
const TREND_MAP = {
  // The "very rapidly" extremes collapse into the nearest normal case —
  // SMHI's 5-value classification doesn't have a slot in the app's
  // existing 4-value Lufttryckstrend, and adding one now would touch the
  // Sheet/Postgres CHECK constraints for no real benefit at this stage.
  'rising_very_rapidly': 'Stigande', 'rising': 'Stigande',
  'steady': 'Stabilt',
  'falling': 'Fallande', 'falling_very_rapidly': 'Fallande'
};
// Buckets a raw hPa number into the same 3 hPa-wide bands LUFTTRYCK_LIST
// already uses (980–982, 983–985, ... 1028–1030, plus the two catch-all
// extremes) — must stay in exact sync with that list if it's ever changed.
function bucketPressure(hpa){
  if(hpa == null || Number.isNaN(hpa)) return 'Ospecificerad';
  if(hpa < 980) return '< 980 hPa';
  if(hpa > 1030) return '> 1030 hPa';
  const lo = 980 + Math.floor((hpa - 980) / 3) * 3;
  return `${lo} – ${lo + 2} hPa`;
}

// Holds the latest successful reading, already translated, plus the raw
// values for the header readout display (which shows real numbers/arrows,
// not the bucketed Sheet/Postgres strings). Null until the first fetch
// succeeds — session.vindriktning/lufttryck/lufttryckstrend simply keep
// their defaultSession() fallback ('Ospecificerad'/'Ospecificerat') until
// then, same best-effort spirit as everything else network-dependent here.
let liveConditions = null;

async function fetchLiveConditions(){
  try{
    const res = await fetch(WEATHER_BASE_URL + '/current_conditions', {
      headers: {
        'Accept-Profile': 'weather',
        'Authorization': 'Bearer ' + WEATHER_READER_TOKEN
      }
    });
    if(!res.ok) return;
    // PostgREST returns a GET against a view/table as a JSON ARRAY of rows
    // by default (confirmed live: [{...}], not a bare object) — take the
    // first (only) row.
    const rows = await res.json();
    const data = Array.isArray(rows) ? rows[0] : rows;
    if(!data) return;
    liveConditions = {
      windDirRaw: data.wind_direction, windSpeed: data.wind_speed_ms,
      pressureRaw: data.air_pressure_hpa, trendRaw: data.pressure_trend_3h,
      asOf: data.as_of
    };
    // Auto-stamp the session fields every new catch already reads from —
    // identical mechanism to the old manual dropdowns, just chosen here
    // instead of by a tap.
    session.vindriktning = WIND_DIR_MAP[data.wind_direction] || 'Ospecificerad';
    session.lufttryck = bucketPressure(data.air_pressure_hpa);
    session.lufttryckstrend = TREND_MAP[data.pressure_trend_3h] || 'Ospecificerat';
    saveAll();
    renderSessionBar();
  } catch(err){
    // Unreachable — offline, not on the tailnet, server down. Expected;
    // whatever was last successfully fetched (or the plain default if
    // nothing ever succeeded) just keeps being used, same as every other
    // best-effort network call in this file.
    console.warn('[weather] current_conditions unreachable:', err);
  }
}

// ---------- State ----------
let catchLog = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
// New fishing spots proposed from the app — held here until the next Exportera,
// same offline-first pattern as catchLog.
let pendingPlatser = JSON.parse(localStorage.getItem(PLATSER_STORAGE_KEY) || '[]');
// The actual Plats-picker list. Starts from whatever was cached from the last
// successful live fetch (see refreshPlatsList), or the static PLATS_LIST as a
// fallback on a brand new install / while still offline. Kept as a separate
// mutable variable (not a const) so a live fetch — or adding a plats via the
// "Lägg till ny plats" form — can update it in place for the current session.
let effectivePlatsList = JSON.parse(localStorage.getItem(PLATS_CACHE_KEY) || 'null') || PLATS_LIST;
// Merge onto defaultSession() (not ||) so a session saved before a new field existed
// (e.g. vindriktning added later) gets backfilled instead of logging catches with it missing.
let session = Object.assign(defaultSession(), JSON.parse(localStorage.getItem(SESSION_KEY) || 'null') || {});
// If the saved URL was never manually customized away from whatever DEFAULT_WEB_APP_URL
// was at the time it was saved (defaultAtSave), and this file's baked-in default has since
// changed (e.g. Code.gs redeployed against a new Sheet), adopt the new default automatically.
// A URL the user deliberately typed into ⚙ Settings (defaultAtSave stays null) is never
// touched by this — only the "never customized, just stale from an old file" case.
let config = JSON.parse(localStorage.getItem(CONFIG_KEY) || 'null');
const configIsStaleDefault = config && config.webAppUrl === config.defaultAtSave && config.defaultAtSave !== DEFAULT_WEB_APP_URL;
if (!config || configIsStaleDefault) {
  config = { webAppUrl: DEFAULT_WEB_APP_URL, secret: config ? config.secret : '', pgToken: config ? config.pgToken : '', defaultAtSave: DEFAULT_WEB_APP_URL };
}
// Backfill for a config saved before pgToken existed — never overwrites a
// real value, just makes sure the field exists so config.pgToken is always
// '' rather than undefined when nothing's been entered yet.
if (config.pgToken === undefined) config.pgToken = '';
// Timestamp of the last successful Sheet export — powers the header status
// chip's "senast synkad X sedan" display (see renderHeaderRight()).
if (config.lastSyncAt === undefined) config.lastSyncAt = null;
// The name this device's angler registered under (see submitPostgresRegistration
// and the "Ditt namn" field in ⚙ → Postgres-token). Once BOTH this and
// config.pgToken are set, the Fiskare picker locks to this name instead of
// offering a choice — see fiskareChipHTML(). Either alone leaves the
// normal picker fully intact (registered-but-no-token-yet, or an old
// device with a token from before this existed).
if (config.registeredName === undefined) config.registeredName = '';

function defaultSession(){
  return {
    fiskare: FISKARE_LIST[0],
    vattentemp: VATTENTEMP_LIST[2],
    vindriktning: VINDRIKTNING_LIST[0],
    lufttryck: LUFTTRYCK_LIST[0], // 'Ospecificerad'
    lufttryckstrend: LUFTTRYCKSTREND_LIST[0], // 'Ospecificerat'
    plats: effectivePlatsList[0], // 'Ospecificerad' as long as it stays first in the Platser sheet
    drag: DRAG_LIST[0]
  };
}

// Always read the device's live date/month — never cached, so a catch is
// stamped with the real date it happened even if the app's been open for days.
function todayISO(){
  const d = new Date();
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0,10);
}
function currentManad(){
  return MANAD_LIST[new Date().getMonth()];
}
// Same "never cached" principle as todayISO() — read live at the moment of
// the click, so fisk/timme-beräkningar i Sheetet stämmer med verkligheten.
function currentTime(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function saveAll(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(catchLog));
  localStorage.setItem(PLATSER_STORAGE_KEY, JSON.stringify(pendingPlatser));
  localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
}

// ---------- Render ----------
function shade(hex, mult){
  const c = hex.replace('#','');
  const r = Math.min(255, Math.round(parseInt(c.substr(0,2),16)*mult));
  const g = Math.min(255, Math.round(parseInt(c.substr(2,2),16)*mult));
  const b = Math.min(255, Math.round(parseInt(c.substr(4,2),16)*mult));
  return `rgb(${r},${g},${b})`;
}

function countFor(art, storlek){
  return catchLog.filter(c => c.art===art && c.storlek===storlek).length;
}

// Session-constant fields shown as live dropdowns in the top bar, in display order.
// Each stays set until changed, and applies to every catch logged after that.
// Fiskare sits between these two groups but renders as a photo-picker instead of a
// plain <select> (see fiskareChipHTML/openFiskarePicker), so it's kept out of this list.
// 'plats' has no static list here on purpose — selectChipsHTML resolves it from
// effectivePlatsList at render time instead, since that list can change at runtime
// (live fetch, or adding a spot via "Lägg till ny plats").
const SESSION_FIELDS_LEFT = [
  { key: 'plats', label: 'Plats' },
  { key: 'drag',  label: 'Drag',  list: DRAG_LIST }
];
// Vindriktning/Lufttryck/Lufttryckstrend removed from here 2026-08-31 — no
// longer manual picks. They're now auto-stamped from a live SMHI reading
// (see the "Live weather auto-fill" section below) and shown as a
// read-only readout in the header instead of a dropdown. VINDRIKTNING_LIST/
// LUFTTRYCK_LIST/LUFTTRYCKSTREND_LIST themselves are NOT removed — the
// Sessionsstatistik table still uses them for manually correcting a catch
// afterward if the auto-fill ever picks up a bad reading.
const SESSION_FIELDS_RIGHT = [
  { key: 'vattentemp', label: 'Vattentemp', list: VATTENTEMP_LIST }
];

function selectChipsHTML(fields){
  return fields.map(f => {
    const list = f.key === 'plats' ? effectivePlatsList : f.list;
    return `
    <div class="chip chip-select">
      <b>${f.label}</b>
      <select data-key="${f.key}">
        ${list.map(v=>`<option value="${v}" ${v===session[f.key]?'selected':''}>${v}</option>`).join('')}
      </select>
    </div>
  `;
  }).join('');
}

function avatarHTML(name){
  const photo = FISKARE_PHOTOS[name];
  return photo ? `<img src="${photo}" alt="">` : `<span>${name.charAt(0)}</span>`;
}

// True once a device has BOTH a personal token and a registered name (⚙ →
// Postgres-token) — the server has ignored whatever `fiskare` the client
// sends since the identity trigger was built (2026-08-30), so offering a
// picker at that point is actively misleading, not just redundant. Either
// field alone leaves the normal picker fully working — covers a
// registered-but-not-yet-approved person, and any device with an old
// token from before this existed.
function identityLocked(){
  return !!(config.pgToken && config.registeredName);
}

function fiskareChipHTML(){
  // Once locked, the identity badge lives in the header's top-right
  // corner instead (see renderHeaderRight()) — no chip needed in the
  // scrollable session bar at all in that state, not even a static one.
  if(identityLocked()) return '';
  return `
    <button class="chip chip-fiskare" id="fiskareChipBtn" type="button">
      <span class="fiskare-chip-avatar">${avatarHTML(session.fiskare)}</span>
      <b>Fiskare</b> <span>${session.fiskare}</span>
    </button>
  `;
}

function renderSessionBar(){
  const bar = document.getElementById('sessionBar');
  bar.innerHTML =
    selectChipsHTML(SESSION_FIELDS_LEFT) +
    fiskareChipHTML() +
    selectChipsHTML(SESSION_FIELDS_RIGHT) +
    `<div class="chip"><b>Datum</b> ${todayISO()} (idag)</div>`;
}

// Swedish relative-time phrasing, shared by the header status chip and the
// weather readout strip below — same "always show when something was
// last actually known" principle applied to both instead of either
// showing a blunt connected/not-connected state.
function timeAgo(isoString){
  if(!isoString) return null;
  const diffMs = Date.now() - new Date(isoString).getTime();
  const min = Math.round(diffMs / 60000);
  if(min < 1) return 'just nu';
  if(min < 60) return min + ' min sedan';
  const tim = Math.round(min / 60);
  return tim + (tim===1 ? ' timme sedan' : ' timmar sedan');
}

const TREND_ARROW = { 'Stigande': '↑', 'Fallande': '↓', 'Stabilt': '→', 'Ospecificerat': '–' };

// Live "right now" HUD strip — replaces the old manual Vindriktning/
// Lufttryck/Trend dropdowns with a read-only display of the same data
// auto-stamped onto session (see fetchLiveConditions above). Shows real
// numbers/arrows here even though the value actually sent to Sheet/Postgres
// is the bucketed/translated version — this strip is purely informational.
function renderReadoutStrip(){
  const el = document.getElementById('readoutStrip');
  if(!liveConditions){
    el.innerHTML = `
      <div class="ro"><div class="ro-label">Väder</div><div class="ro-value stale">Väntar på data…</div></div>
    `;
    return;
  }
  const age = timeAgo(liveConditions.asOf);
  const trendWord = TREND_MAP[liveConditions.trendRaw] || 'Ospecificerat';
  const staleCls = ''; // could flag very old readings here later if needed
  el.innerHTML = `
    <div class="ro"><div class="ro-label">Vind</div><div class="ro-value ${staleCls}">${liveConditions.windDirRaw} ${liveConditions.windSpeed} m/s</div></div>
    <div class="ro"><div class="ro-label">Atm.tryck</div><div class="ro-value ${staleCls}">${liveConditions.pressureRaw} hPa</div></div>
    <div class="ro"><div class="ro-label">Trycktrend</div><div class="ro-value ${staleCls}">${TREND_ARROW[trendWord]||''} ${trendWord.toLowerCase()}</div></div>
    <div class="ro"><div class="ro-label">Uppdaterad</div><div class="ro-value stale">${age||'–'}</div></div>
  `;
}

// Header status chip — replaces the old static "OFFLINE · LOKALT KÖ" label
// with when the app last actually synced successfully (config.lastSyncAt,
// set in performExport() on a real Sheet-export success). Same principle
// as the readout strip above: a real "as of" timestamp, never a blunt
// binary connected/disconnected state.
// Rebuilds the header's entire right-side cluster (2026-08-31): Sheet
// sync status, weather sync status, and — once identity is locked (see
// identityLocked()) — a static avatar+name badge. That badge replaces the
// old session-bar Fiskare picker chip entirely once locked; it's now a
// persistent "who am I" indicator up in the corner instead of something
// picked fresh each session, since the server has ignored whatever
// fiskare a locked device sends since the identity trigger was built.
// Sheet-sync status (config.lastSyncAt) moved OUT of the header (2026-08-31)
// — it and the weather-sync chip looked like near-duplicates whenever both
// happened to say "not synced yet" at once, even though they track
// completely different things. It now lives inside Sessionsstatistik (see
// openStatsView()) instead — the place you're already checking on your
// session's data, a better fit than the always-visible header. Kept as
// its own small helper so both call sites (there, if ever needed again)
// share the exact same text/logic.
function syncStatusText(){
  const age = timeAgo(config.lastSyncAt);
  return age ? ('Senast synkad ' + age) : 'Ännu inte synkad';
}

function renderHeaderRight(){
  const el = document.getElementById('headerRight');
  if(!el) return;

  const weatherAge = liveConditions ? timeAgo(liveConditions.asOf) : null;
  const weatherText = weatherAge ? ('VÄDER: SENAST SYNKAD ' + weatherAge.toUpperCase()) : 'VÄDER: ÄNNU INTE SYNKAD';

  let identityHTML = '';
  if(identityLocked()){
    // Same force-sync fiskareChipHTML() used to do before this moved —
    // keeps catch logging/export correct even if session.fiskare was
    // last saved as someone else before this device's lock was set up.
    if(session.fiskare !== config.registeredName){
      session.fiskare = config.registeredName;
      saveAll();
    }
    identityHTML = `
      <div class="identity-badge" title="Låst till din registrerade identitet (⚙ → Postgres-token)">
        <span class="fiskare-chip-avatar">${avatarHTML(session.fiskare)}</span>
        <span class="identity-name">${session.fiskare}</span>
      </div>
    `;
  }

  el.innerHTML = `
    <span class="status-chip status-chip-weather"><span class="status-dot"></span>${weatherText}</span>
    ${identityHTML}
  `;
}

// Delegated once — survives the innerHTML rebuild since the bar element itself never changes.
document.getElementById('sessionBar').addEventListener('change', (e)=>{
  const key = e.target.dataset.key;
  if(!key) return;
  session[key] = e.target.value;
  saveAll();
});
document.getElementById('sessionBar').addEventListener('click', (e)=>{
  if(e.target.closest('#fiskareChipBtn')) openFiskarePicker();
});

// Weight ranges defining Liten/Mellan/Stor per species, shown as a small
// caption on each counter row. Abborre only for now (2026-08-31) — other
// species left untouched until their own ranges are decided; a species
// with no entry here just shows the usual session-% meta line as before.
const WEIGHT_SPANS = {
  Abborre: { Liten: '0–300 g', Mellan: '300–600 g', Stor: '600 g+' }
};

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const sessionTotal = catchLog.length;
  SPECIES.forEach(sp=>{
    const speciesTotal = catchLog.filter(c=>c.art===sp.art).length;
    const header = document.createElement('div');
    header.className = 'species-header';
    header.style.color = sp.color;
    header.innerHTML = `<span class="name">${sp.art}</span><span class="rule"></span><span class="total" style="color:var(--muted2)">${speciesTotal} st</span>`;
    grid.appendChild(header);

    SIZES.forEach(size=>{
      const n = countFor(sp.art,size);
      const pct = sessionTotal ? Math.round((n/sessionTotal)*100) : 0;
      const row = document.createElement('div');
      row.className = 'row' + (n>0 ? ' has-count' : '');
      row.innerHTML = `
        <div class="side minus" data-art="${sp.art}" data-size="${size}" data-op="-">–</div>
        <div class="mid">
          <div class="mid-label">
            <div class="label">${size}</div>
            ${WEIGHT_SPANS[sp.art] ? `<div class="weight-span">${WEIGHT_SPANS[sp.art][size]}</div>` : ''}
            <div class="meta">${n>0 ? pct+'% av session' : '—'}</div>
          </div>
          <div class="count">${n}</div>
        </div>
        <div class="side plus" data-art="${sp.art}" data-size="${size}" data-op="+">+</div>
        <div class="share-line" style="width:${pct}%;background:${sp.color};box-shadow:0 0 10px ${sp.color}"></div>
      `;
      grid.appendChild(row);
    });
  });
  document.getElementById('btnExport').disabled = (catchLog.length === 0 && pendingPlatser.length === 0);
}

document.getElementById('grid').addEventListener('click', (e)=>{
  const el = e.target.closest('[data-op]');
  if(!el) return;
  const art = el.dataset.art, size = el.dataset.size, op = el.dataset.op;
  if(op === '+'){
    catchLog.push({
      id: Date.now()+'-'+Math.random().toString(36).slice(2,7),
      art, storlek: size,
      fiskare: session.fiskare,
      manad: currentManad(),
      vattentemp: session.vattentemp,
      vindriktning: session.vindriktning,
      lufttryck: session.lufttryck,
      lufttryckstrend: session.lufttryckstrend,
      plats: session.plats,
      drag: session.drag,
      vikt: null,  // gram — ifylls senare i sessionsvyn när fisken faktiskt vägs
      langd: null, // cm — ifylls senare i sessionsvyn när fisken faktiskt mäts
      datum: todayISO(),
      tid: currentTime(),
      ts: new Date().toISOString()
    });
  } else {
    // remove most recent matching catch
    for(let i=catchLog.length-1;i>=0;i--){
      if(catchLog[i].art===art && catchLog[i].storlek===size){ catchLog.splice(i,1); break; }
    }
  }
  saveAll();
  renderGrid();
});

// ---------- Settings sheet ----------
const overlay = document.getElementById('overlay');
const sheet = document.getElementById('sheet');

function openOverlay(html){
  sheet.innerHTML = html;
  overlay.classList.add('open');
}
function closeOverlay(){ overlay.classList.remove('open'); }
overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeOverlay(); });

// Brief, non-blocking confirmation for things that don't need a dedicated
// dialog (settings saved, plats added, session reset, etc.) — auto-dismisses,
// never blocks input the way an overlay does.
let toastTimer = null;
function showToast(msg){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 2200);
}

// Fiskare picker — tap a face (or an initial-letter fallback for anyone without a
// photo) to set who's fishing for the rest of the session.
function openFiskarePicker(){
  const cards = FISKARE_LIST.map(name => {
    const photo = FISKARE_PHOTOS[name];
    const img = photo
      ? `<img src="${photo}" alt="">`
      : `<span>${name.charAt(0)}</span>`;
    const active = name === session.fiskare ? ' active' : '';
    return `
      <button class="fiskare-card${active}" data-name="${name}" type="button">
        <span class="fiskare-card-photo">${img}</span>
        <span class="fiskare-card-name">${name}</span>
      </button>`;
  }).join('');

  openOverlay(`
    <h2>Vem fiskar?</h2>
    <div class="fiskare-grid">${cards}</div>
  `);
  sheet.querySelectorAll('.fiskare-card').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      session.fiskare = btn.dataset.name;
      saveAll();
      renderSessionBar();
      closeOverlay();
    });
  });
}

        : 'Läggs till i Platser-fliken vid nästa export, och blir direkt valbar i Plats-listan här på din telefon. Övriga i gruppen får den automatiskt nästa gång deras app har nätverk.'}
    </p>

// Clears only the service worker's Cache Storage (the app's own code files —
// index.html, manifest, icons) so a stale installed copy re-fetches the
// latest deploy. Deliberately never touches localStorage — catchLog,
// pendingPlatser, effectivePlatsList, session and config all live there and
// are completely untouched by this, so an unexported fishing session or a
// just-added-but-not-yet-exported plats survives a cache clear just fine.
function confirmClearAppCache(){
  if(!navigator.onLine){
    openOverlay(`
      <h2>Ingen nätanslutning</h2>
      <p style="color:var(--muted);font-size:13.5px;margin-top:-8px;">
        Rensar du cachen nu, utan nät, kan appen sluta gå att öppna tills du
        har täckning igen — det finns då ingen lokal kopia kvar att visa.
        Vänta tills du har wifi/mobildata.
      </p>
      <div class="row-actions">
        <button class="btn btn-primary" id="ccBack" style="width:100%;">Tillbaka</button>
      </div>
    `);
    document.getElementById('ccBack').addEventListener('click', openSettings);
    return;
  }
  openOverlay(`
    <h2>Rensa app-cache?</h2>
    <p style="color:var(--muted);font-size:13.5px;margin-top:-8px;">
      Dina loggade fångster, väntande platser och inställningar påverkas
      inte — bara appens egna filer rensas och hämtas färska. Så här går det till:
    </p>
    <ol style="color:var(--text);font-size:13.5px;margin:0 0 14px;padding-left:20px;line-height:1.6;">
      <li>Tryck "Ja, rensa &amp; ladda om" nedan.</li>
      <li>Skärmen blinkar till och laddar om sig själv — helt automatiskt,
        rör inget mer under tiden.</li>
      <li>En liten "✅ Uppdaterat"-ruta dyker upp när det är klart — då har
        appen den senaste versionen och du kan fortsätta logga direkt.</li>
    </ol>
    <div class="row-actions">
      <button class="btn btn-secondary" id="ccCancel">Avbryt</button>
      <button class="btn btn-primary" id="ccConfirm">Ja, rensa &amp; ladda om</button>
    </div>
  `);
  document.getElementById('ccCancel').addEventListener('click', openSettings);
  document.getElementById('ccConfirm').addEventListener('click', clearAppCache);
}

async function clearAppCache(){
  try{
    if('caches' in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
  } catch(e){ /* best-effort — reload anyway, worst case the old cache just stays */ }
  // sessionStorage (not localStorage) so this survives exactly the one reload
  // it's meant for, then disappears on its own — no separate "clear" step needed.
  sessionStorage.setItem('pelagio_cache_just_cleared', '1');
  location.reload();
}

// Builds a compact <select> for one editable table cell — used so a misclick
// (wrong species tapped, forgot to switch Plats/Drag/Fiskare/Vind before
// continuing to log) can be fixed right there in the list instead of having
// to delete the catch and log it again.
function cellSelectHTML(list, id, field, current){
  const opts = list.map(v=>`<option value="${v}" ${v===current?'selected':''}>${v}</option>`).join('');
  return `<select class="cell-select" data-id="${id}" data-field="${field}">${opts}</select>`;
}

function openStatsView(){
  const rows = [...catchLog].reverse().map(c=>`

      <td>${cellSelectHTML(effectivePlatsList, c.id, 'plats', c.plats)}</td>
      <td>${cellSelectHTML(DRAG_LIST, c.id, 'drag', c.drag)}</td>
      <td>${cellSelectHTML(VINDRIKTNING_LIST, c.id, 'vindriktning', c.vindriktning)}</td>

      <td>${cellSelectHTML(LUFTTRYCKSTREND_LIST, c.id, 'lufttryckstrend', c.lufttryckstrend)}</td>

      <td><button class="measure-cell ${c.langd==null?'unset':''}" data-id="${c.id}">${c.langd!=null ? c.langd+' cm' : '–'}</button></td>

    </tr>
  `).join('') || `<tr><td colspan="13" style="text-align:center;color:var(--muted);">Inga fångster ännu</td></tr>`;

  const liten = catchLog.filter(c=>c.storlek==='Liten').length;
  const mellan = catchLog.filter(c=>c.storlek==='Mellan').length;
  const stor = catchLog.filter(c=>c.storlek==='Stor').length;

  openOverlay(`
    <h2>Sessionsstatistik (${catchLog.length} fångster)</h2>
    <p style="color:var(--muted2);font-size:11px;margin:-10px 0 14px;font-family:var(--mono);">
      ${syncStatusText()}
    </p>
    <div class="stats-table-wrap">
      <table class="stats-table">
        <thead><tr>
          <th>Art</th><th>Storlek</th><th>Fiskare</th><th>Plats</th><th>Drag</th><th>Vind</th><th>Tryck</th><th>Trend</th><th>Datum</th><th>Tid</th><th>Vikt</th><th>Längd</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p style="color:var(--muted);font-size:11px;margin:10px 2px 0;">
      Tryck på Vikt/Längd för att fylla i efter vägning/mätning — valfritt om ni bara gjort ett av de två.
      Art/Storlek/Fiskare/Plats/Drag/Vind går att ändra direkt i listan om något
      loggades fel eller glömdes byta.
    </p>
    <div class="stats-summary">
      <div class="stats-chip"><b>${catchLog.length}</b>Totalt</div>
      <div class="stats-chip"><b>${liten}</b>Liten</div>
      <div class="stats-chip"><b>${mellan}</b>Mellan</div>
      <div class="stats-chip"><b>${stor}</b>Stor</div>
    </div>
  `);
  sheet.querySelectorAll('.measure-cell').forEach(btn=>{
    btn.addEventListener('click', ()=> openMeasureForm(btn.dataset.id));
  });
  // Deleting a mis-tapped catch entirely (not just correcting a field) —
  // formerly the ☰ button's only job, folded in here so there's one table
  // instead of two overlapping views. No confirmation, matching the
  // original ☰ list's own behavior exactly (a single row, not the whole
  // session — "Ny session" below is the one that needs a confirm dialog).
  sheet.querySelectorAll('.del-cell').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      catchLog = catchLog.filter(c=>c.id!==btn.dataset.delId);
      saveAll();
      renderGrid();
      openStatsView();
    });
  });
  // Correcting a misclick (wrong species tapped, forgot to switch a session
  // field) — updates just that one logged catch, doesn't touch the current
  // top-bar session state or any other row.
  sheet.querySelectorAll('.cell-select').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const c = catchLog.find(x=>x.id===sel.dataset.id);
      if(!c) return;
      c[sel.dataset.field] = sel.value;
      saveAll();
      // Re-render so the Liten/Mellan/Stor summary chips stay correct after
      // an Art/Storlek correction (they're computed fresh on each render).
      openStatsView();
    });
  });
}

// Field-name renames only — Postgres's fishing.catches columns match
// FIELD_TO_HEADER's keys (Code.gs) exactly except these three, renamed for
// unit clarity when the schema was built. No "source" key here — the
// Postgres side defaults that to 'app' automatically. Keep in sync if
// either side's field list ever changes (see CLAUDE.md).
function toPostgresCatch(c){
  return {
    datum: c.datum, tid: c.tid, manad: c.manad, fiskare: c.fiskare,
    plats_id: c.plats, vattentemp: c.vattentemp, vindriktning: c.vindriktning,
    lufttryck: c.lufttryck, lufttryckstrend: c.lufttryckstrend,
    art: c.art, storlek: c.storlek, vikt_g: c.vikt, langd_cm: c.langd,
    drag: c.drag
  };
}

// fishing.platser stores latitude/longitude as real NUMERIC columns, parsed
// out of this app's single free-text "Google coordinates" field. Same
// gotcha documented in CLAUDE.md's recurring gotchas: values use Swedish
// comma-decimal AND the comma also separates lat from long, so split on
// ", " (comma+space) — never a bare ",", or every number splits in half.
function parseCoordinates(raw){
  if(!raw) return { latitude: null, longitude: null };
  const parts = raw.split(', ');
  if(parts.length !== 2) return { latitude: null, longitude: null };
  const lat = parseFloat(parts[0].replace(',', '.'));
  const lng = parseFloat(parts[1].replace(',', '.'));
  return {
    latitude: Number.isNaN(lat) ? null : lat,
    longitude: Number.isNaN(lng) ? null : lng
  };
}

function toPostgresPlats(p){
  const { latitude, longitude } = parseCoordinates(p.coordinates);
  return {
    plats_id: p.platsId, latitude, longitude, raw_coordinates: p.coordinates,
    zon: p.zon, djup_m: p.djup, bottentyp: p.bottentyp, notering: p.notering
  };
}

// One bulk-insert POST to a PostgREST endpoint. Best-effort and self-
// contained: NEVER throws, so a caller can fire this without awaiting it
// and it can never affect the Sheet export's own success/failure path —
// same "wrapped, silently best-effort" philosophy Code.gs already uses for
// appendToIndexListorPlatsList's convenience sync. Does distinguish, via
// console.warn, "couldn't reach the server at all" (offline/not on the
// tailnet/server down — expected during rollout, nothing to act on) from
// "server rejected this data" (a real signal: a FK/CHECK constraint failed,
// meaning this app's value lists and the fishing schema's reference data
// have drifted apart — see Homelab's README.md "Fishing data" section).
// TEMPORARY DEBUG (added 2026-08-29 at Homelab's request): a real phone
// write isn't landing in Postgres despite the server chain (HTTPS + Caddy +
// PostgREST) verified working via curl with the exact same payload —
// console.warn is invisible with no devtools attached to a real device, so
// this puts the actual error on screen instead. REMOVE once the root cause
// is found; not meant to stay long-term.
function showPgDebug(msg){
  let el = document.getElementById('pgDebugBanner');
  if(!el){
    el = document.createElement('div');
    el.id = 'pgDebugBanner';
    el.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;'
      + 'background:#3a0d0d;color:#ffd9d9;border:1px solid #ff6b6b;border-radius:8px;'
      + 'padding:10px 12px;font:12px/1.4 monospace;white-space:pre-wrap;'
      + 'max-height:40vh;overflow:auto;box-shadow:0 4px 16px rgba(0,0,0,.4);';
    el.addEventListener('click', () => el.remove());
    document.body.appendChild(el);
  }
  const time = new Date().toLocaleTimeString('sv-SE');
  el.textContent = '🔧 DEBUG (tillfälligt) [' + time + ']\n' + msg + '\n\n(tryck för att stänga)';
}

async function postgresWrite(path, rowsArr){
  // No personal token configured on this device (⚙ → Postgres-token) —
  // skip entirely, don't even attempt the request. This is the actual
  // safety mechanism now (see the note above PG_BASE_URL): a device with
  // nothing configured can never write, misattribute, or leak anything.
  if(!rowsArr.length || !config.pgToken) return;
  try{
    const res = await fetch(PG_BASE_URL + path, {
      method: 'POST',
      headers: {
        'Content-Profile': 'fishing',
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + config.pgToken
        // Deliberately NO "Prefer: return=representation" here — the
        // fishing_writer role has no SELECT at all, and PostgREST's
        // INSERT...RETURNING needs SELECT even for your own just-inserted
        // row. A plain 201 with an empty body is success. See Homelab's
        // LEARNING_LOG.md (search "write path") for the full story.
      },
      body: JSON.stringify(rowsArr)
    });
    if(!res.ok){
      const body = await res.text().catch(()=>'');
      console.warn('[Postgres dual-write] ' + path + ' rejected (' + res.status + '): ' + body);
      showPgDebug('AVVISAD: ' + path + '\nStatus: ' + res.status + '\nSvar: ' + (body || '(tomt)'));
    }
  } catch(err){
    // Unreachable — offline, phone not on the tailnet yet, server down.
    // Expected during the beta rollout; the Sheet export is still the
    // system of record, so there's nothing here worth surfacing to the angler
    // long-term (hence showPgDebug being temporary, not a permanent UI element).
    console.warn('[Postgres dual-write] ' + path + ' unreachable (offline or not on the tailnet?):', err);
    showPgDebug('ONÅBAR: ' + path + '\n' + (err && err.message ? err.message : String(err)));
  }
}

// TEMPORARY DEBUG (added 2026-08-29 at Homelab's request): isolates the raw
// Postgres fetch from EVERYTHING else — the Sheet export, the
// Promise.allSettled timing fix, even showPgDebug()'s own rendering code
// (which could in principle have its own bug independent of the actual
// write). A single, fully-awaited fetch with one minimal hardcoded valid
// row, result shown via plain alert() — no custom UI to doubt.
// REMOVE once the dual-write root cause is confirmed fixed.
async function runPgIsolationTest(){
  if(!config.pgToken){
    alert('PG-ISOLATIONSTEST\nIngen personlig token sparad ännu — fyll i "Personlig token" ovanför och tryck Spara token först.');
    return;
  }
  const testRow = {

    fiskare: session.fiskare, plats_id: 'Havsbadet', vattentemp: '15 – 18°C',
    vindriktning: 'Ospecificerad', lufttryck: 'Ospecificerad',
    lufttryckstrend: 'Ospecificerat', art: 'Abborre', storlek: 'Mellan',

  };
  try{

      },

  }
}

// ---------- Postgres registration (beta) ----------
// Self-service sign-up for the new per-user auth system (see the note
// above PG_BASE_URL and Homelab's README.md "Fishing data" section for
// the full fishing.users design). Deliberately sends NO Authorization
// header at all — this endpoint requires none by design, since nobody
// has a token yet at this point in the flow. A successful POST just
// lands the person as "pending"; approval and the actual personal token
// both stay manual/out-of-band (Kecke → SQL update → hands the token
// directly to them, never through chat) — nothing else to build here.
async function submitPostgresRegistration(){
  const fiskare = document.getElementById('fRegFiskare').value.trim();
  const email = document.getElementById('fRegEmail').value.trim();
  const feedback = document.getElementById('fRegFeedback');
  const btn = document.getElementById('fRegSubmit');

  function showFeedback(text, ok){
    feedback.textContent = text;
    feedback.style.display = 'block';
    feedback.style.color = ok ? 'var(--good)' : 'var(--bad)';
  }

  if(!fiskare){
    showFeedback('Fyll i ditt namn.', false);
    return;
  }
  if(!email){
    showFeedback('Fyll i din mejladress.', false);
    return;
  }

  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = 'Registrerar…';

  try{
    const res = await fetch(PG_BASE_URL + '/users', {
      method: 'POST',
      headers: {
        'Content-Profile': 'fishing',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ email, fiskare })
    });
    if(res.status === 201){
      showFeedback('✅ Registrerad som ' + fiskare + '! Väntar på att Kecke godkänner dig — han skickar sedan en personlig token direkt till dig (klistras in nedanför under "Postgres-token").', true);
      document.getElementById('fRegEmail').value = '';
      // Remembered locally purely as a convenience pre-fill for the
      // Postgres-token section below (and this form, if reopened) — has
      // no effect until a token also gets entered (see the identity-lock
      // logic in fiskareChipHTML()).
      config.registeredName = fiskare;
      saveAll();
    } else if(res.status === 409){
      // fishing.users has TWO separate unique constraints (email, fiskare)
      // as of 2026-08-31 — a name collision would otherwise silently merge
      // two real anglers' catches in the stats layer, so it's rejected
      // outright too, not just a duplicate email. Distinguish which one
      // fired from the error body's text rather than assuming.
      const body = await res.text().catch(()=>'');
      if(/fiskare/i.test(body)){
        showFeedback('Namnet "' + fiskare + '" är redan taget av någon annan. Välj ett annat (t.ex. med efternamn) eller hör av dig till Kecke om det borde vara du.', false);
      } else {
        showFeedback('Den mejladressen är redan registrerad. Hör av dig till Kecke om du väntar på godkännande eller en token.', false);
      }
    } else {
      const body = await res.text().catch(()=>'');
      showFeedback('Något gick fel (status ' + res.status + '): ' + (body || 'inget felmeddelande från servern') + '. Hör av dig till Kecke.', false);
    }
  } catch(err){
    showFeedback('Kunde inte nå servern — kolla att du är ansluten till Tailscale och har nät. (' + (err && err.message ? err.message : String(err)) + ')', false);
  }

  btn.disabled = false;
  btn.textContent = originalText;
}

async function performExport(){
  const btn = document.getElementById('btnExport');
  btn.disabled = true;
  btn.textContent = 'Skickar…';

  const rows = catchLog.map(c=>({
    manad: c.manad, fiskare: c.fiskare, art: c.art, storlek: c.storlek,
    vattentemp: c.vattentemp, plats: c.plats, drag: c.drag,
    vindriktning: c.vindriktning, lufttryck: c.lufttryck, lufttryckstrend: c.lufttryckstrend, datum: c.datum, tid: c.tid,
    vikt: c.vikt, langd: c.langd
  }));
  const platser = pendingPlatser.map(p=>({
    platsId: p.platsId, coordinates: p.coordinates, zon: p.zon,
    djup: p.djup, bottentyp: p.bottentyp, notering: p.notering
  }));

  // No per-row filtering by name needed (see the note above PG_BASE_URL,
  // 2026-08-30): the server ignores whatever `fiskare` is sent and always
  // attributes the catch to whoever's personal token made the request.
  // The real safety mechanism is config.pgToken itself — postgresWrite()
  // below silently skips everything if this device has no token
  // configured, which is exactly correct on Björn/Tobbe's phones today
  // (Sheet export completely unaffected either way).

  // Dual-write beta: fired without awaiting here, so they can't delay or
  // block the Sheet export's own success/failure path below — postgresWrite()
  // never throws either way. BUT the two promises are kept and awaited
  // together near the end of this function (see Promise.allSettled below) —
  // otherwise, on a real phone, the browser can abandon an unawaited
  // in-flight fetch() the moment the page backgrounds/reloads/navigates
  // right after "Klart!" appears, silently killing the request before it
  // ever reaches either postgresWrite()'s success path or its own
  // catch/!res.ok branches. Diagnosed by Homelab 2026-08-29 after a real
  // catch showed neither a debug banner nor a landed row — see README
  // changelog for the full story. Awaiting at the end keeps this async
  // function's execution (and therefore the fetches) alive until they
  // actually finish, without ever delaying the Klart! message itself.
  const pgWrites = [
    postgresWrite('/catches', rows.map(toPostgresCatch)),
    postgresWrite('/platser', platser.map(toPostgresPlats))
  ];

  try{
    const res = await fetch(config.webAppUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ rows, platser, secret: config.secret || '' })
    });
    const data = await res.json();
    if(data.success){
      catchLog = [];
      pendingPlatser = [];
      config.lastSyncAt = new Date().toISOString();
      saveAll();
      renderGrid();
      renderHeaderRight();
      const platserNote = data.platserAdded ? `, ${data.platserAdded} plats(er)` : '';
      btn.textContent = `Klart! ${data.count} sparade${platserNote} ✓`;
    } else {
      btn.textContent = 'Fel: ' + (data.error || 'okänt');
    }
  } catch(err){
    btn.textContent = 'Ingen anslutning — försök igen senare';
  }
  setTimeout(()=>{ btn.textContent='Exportera'; btn.disabled = (catchLog.length===0 && pendingPlatser.length===0); }, 2500);

  // See the comment above pgWrites — this is what actually keeps the two
  // dual-write fetches alive long enough to complete on a real device.
  await Promise.allSettled(pgWrites);
}

// ---------- Live Plats sync ----------
// Fire-and-forget query against the same Apps Script URL used for export.
// Deliberately a POST with an {action:'getPlatser'} marker, not a true GET —
// testing showed a real GET's response gets CORS-blocked when read via fetch()
// from a cross-origin page like this one, while POST responses don't have
// that problem. So this reuses the exact request shape already proven to work
// for export. Silently keeps using the cached/fallback list on any failure —
// offline, misconfigured URL, whatever — never blocks the app on this.
async function refreshPlatsList(){
  try{
    const res = await fetch(config.webAppUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'getPlatser', secret: config.secret || '' })
    });
    const data = await res.json();
    if(data.success && Array.isArray(data.platser) && data.platser.length){
      effectivePlatsList = data.platser;
      localStorage.setItem(PLATS_CACHE_KEY, JSON.stringify(effectivePlatsList));
      renderSessionBar(); // re-render so an already-open Plats dropdown picks up the fresh list
    }
  }catch(err){
    // offline, or Apps Script not reachable — fine, keep what we already have
  }
}

// ---------- Init ----------
renderSessionBar();
renderGrid();
refreshPlatsList();
renderHeaderRight();
renderReadoutStrip();
fetchLiveConditions().then(() => { renderReadoutStrip(); renderHeaderRight(); });
// Data only updates hourly server-side (per Homelab), so this just keeps
// the reading itself from ever going too stale — the "X min sedan" text
// updates far more often, via the separate tick below, without needing
// a new network call each time.
setInterval(() => fetchLiveConditions().then(() => { renderReadoutStrip(); renderHeaderRight(); }), 10 * 60 * 1000);
// Keeps every freshness display ("senast synkad...", the readout strip's
// "uppdaterad...", the header's weather-sync chip) ticking forward on
// their own, without waiting for some unrelated user action to trigger
// a re-render.
setInterval(() => { renderHeaderRight(); renderReadoutStrip(); }, 60 * 1000);

// Confirms the "Rensa app-cache" flow (⚙ → Felsökning) actually landed a
// fresh copy — the flag is set right before reload and only survives this
// one load, so it can't pop up again on a normal app open.
if(sessionStorage.getItem('pelagio_cache_just_cleared')){
  sessionStorage.removeItem('pelagio_cache_just_cleared');
  openOverlay(`
    <h2>✅ Uppdaterat</h2>
    <p style="color:var(--muted);font-size:13.5px;margin-top:-8px;">
      Appen har hämtat den senaste versionen. Dina loggade fångster och
      inställningar finns kvar precis som innan.
    </p>
    <div class="row-actions">
      <button class="btn btn-primary" id="cuOk" style="width:100%;">Ok</button>
    </div>
  `);
  document.getElementById('cuOk').addEventListener('click', closeOverlay);
}

// Registered last and deliberately fire-and-forget: if this fails (unsupported
// browser, file:// during local testing, etc.) the app still works exactly as
// before, just without the offline-shell-loading benefit. See sw.js for why.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
